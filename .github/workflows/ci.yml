name: CI

on:
  push:
    branches-ignore:
      - main
      - staging
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cotales_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATASOURCE_URL: jdbc:postgresql://localhost:5432/cotales_test
      DATASOURCE_USERNAME: test
      DATASOURCE_PASSWORD: test
      JWT_SECRET: ci-test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test, and verify formatting
        run: mvn verify
