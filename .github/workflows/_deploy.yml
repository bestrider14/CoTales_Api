name: Deploy

on:
  workflow_call:
    inputs:
      spring-profile:
        required: true
        type: string
      image-tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cotales_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATASOURCE_URL: jdbc:postgresql://localhost:5432/cotales_test
      DATASOURCE_USERNAME: test
      DATASOURCE_PASSWORD: test
      JWT_SECRET: ci-test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test, and verify formatting
        run: mvn verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ inputs.image-tag }}
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to server via SSH
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ inputs.image-tag }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SPRING_PROFILE: ${{ inputs.spring-profile }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/ec2.pem
          chmod 600 /tmp/ec2.pem

          # Copy the latest compose file to the server
          scp -i /tmp/ec2.pem -o StrictHostKeyChecking=no \
            deploy/docker-compose.yml ec2-user@${{ secrets.EC2_HOST }}:~/docker-compose.yml

          # Login to ECR on the server (uses EC2 instance profile — no credentials stored)
          # Then pull the new image and restart only the app container (DB keeps running)
          ssh -i /tmp/ec2.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
            "aws ecr get-login-password --region $AWS_REGION \
               | docker login --username AWS --password-stdin $ECR_REGISTRY \
             && APP_IMAGE=$IMAGE SPRING_PROFILE=$SPRING_PROFILE \
                docker compose -f ~/docker-compose.yml up -d --no-deps app"

          rm /tmp/ec2.pem
